# ─────────────────────────────────────────────────────────────────────────────
# Metric catalog — single source of truth for all business metrics.
# Used by the AI assistant, dbt exposures, and Power BI documentation.
# ─────────────────────────────────────────────────────────────────────────────

metrics:

  gross_revenue:
    display_name: Gross Revenue
    description: Total order-item revenue before discounts and refunds.
    formula: "SUM(fct_order_items.revenue)"
    grain: order_item
    source_tables: [fct_order_items]
    filters: ["order_status NOT IN ('cancelled')"]
    unit: USD
    format: "$#,##0"
    limitations: Excludes cancelled orders; includes pending/disputed items.

  net_revenue:
    display_name: Net Revenue
    description: Revenue after discounts and refunds.
    formula: "gross_revenue - total_discounts - total_refunds"
    grain: order_item
    source_tables: [fct_order_items, fct_refunds]
    unit: USD
    format: "$#,##0"

  cogs:
    display_name: COGS
    description: Cost of goods sold for shipped/delivered items.
    formula: "SUM(fct_order_items.cost)"
    grain: order_item
    source_tables: [fct_order_items]
    unit: USD
    format: "$#,##0"

  gross_profit:
    display_name: Gross Profit
    description: Net revenue minus COGS.
    formula: "net_revenue - cogs"
    grain: order_item
    source_tables: [fct_order_items, fct_refunds]
    unit: USD
    format: "$#,##0"

  gross_margin_pct:
    display_name: Gross Margin %
    description: Gross profit as a percentage of net revenue.
    formula: "gross_profit / net_revenue"
    grain: order_item
    source_tables: [fct_order_items, fct_refunds]
    unit: percent
    format: "0.0%"
    limitations: Returns null when net_revenue = 0.

  order_count:
    display_name: Orders
    description: Count of distinct orders.
    formula: "COUNT(DISTINCT fct_orders.order_id)"
    grain: order
    source_tables: [fct_orders]
    filters: ["order_status NOT IN ('cancelled')"]

  aov:
    display_name: AOV
    description: Average order value (net revenue per order).
    formula: "net_revenue / order_count"
    grain: order
    source_tables: [fct_orders, fct_order_items, fct_refunds]
    unit: USD
    format: "$#,##0.00"

  new_customers:
    display_name: New Customers
    description: Customers placing their first order in the period.
    formula: "COUNT(DISTINCT customer_id) WHERE is_first_order = TRUE"
    grain: customer
    source_tables: [dim_customer, fct_orders]

  cac:
    display_name: CAC
    description: Customer acquisition cost — ad spend divided by new customers acquired.
    formula: "total_ad_spend / new_customers"
    grain: period
    source_tables: [fct_ad_spend, fct_orders, dim_customer]
    unit: USD
    format: "$#,##0.00"
    limitations: >
      Attribution is last-touch only. Does not include non-advertising acquisition costs.

  roas:
    display_name: ROAS
    description: Return on ad spend — attributed revenue divided by ad spend.
    formula: "attributed_revenue / ad_spend"
    grain: campaign × date
    source_tables: [fct_ad_spend]
    format: "0.00x"
    limitations: Attribution model is last-touch; may overstate for upper-funnel campaigns.

  refund_rate:
    display_name: Refund Rate
    description: Refund revenue as a percentage of gross revenue.
    formula: "total_refunds / gross_revenue"
    grain: order
    source_tables: [fct_refunds, fct_order_items]
    unit: percent
    format: "0.0%"

  inventory_turnover:
    display_name: Inventory Turnover
    description: COGS divided by average inventory value over the period.
    formula: "cogs / AVG(inventory_value)"
    grain: product × warehouse × date
    source_tables: [fct_inventory, fct_order_items]
    format: "0.0x"

  ltv:
    display_name: Customer LTV
    description: Total net revenue generated by a customer to date.
    formula: "SUM(net_revenue) grouped by customer_id"
    grain: customer
    source_tables: [fct_orders, fct_order_items, fct_refunds]
    unit: USD
    format: "$#,##0"

# ── Time-intelligence variants ─────────────────────────────────────────────
# These are applied on top of each metric above in Power BI / SQL.
time_intelligence:
  - mtd   # month-to-date
  - qtd   # quarter-to-date
  - ytd   # year-to-date
  - pm    # previous month (same calendar period)
  - py    # previous year (same calendar period)
  - mom_pct  # month-over-month %
  - yoy_pct  # year-over-year %
