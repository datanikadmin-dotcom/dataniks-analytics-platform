name: novacommerce
version: "0.1.0"
config-version: 2

profile: novacommerce

model-paths: ["models"]
test-paths:  ["tests"]
seed-paths:  ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  novacommerce:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
      dimensions:
        +schema: marts
        +materialized: table
      facts:
        +schema: marts
        +materialized: table
      sales:
        +schema: marts
        +materialized: table
      customers:
        +schema: marts
        +materialized: table
      marketing:
        +schema: marts
        +materialized: table
      inventory:
        +schema: marts
        +materialized: table
      finance:
        +schema: marts
        +materialized: table
